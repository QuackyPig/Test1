<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        url("imagefologin.png") no-repeat center center/cover;
}

.container {
    width: 350px;
    padding: 40px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    color: #fff;
    text-align: center;
}

h2 {
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: none;
    border-radius: 8px;
    outline: none;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 25px;
    background: #fff;
    color: #764ba2;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #764ba2;
    color: #fff;
}

.hidden {
    display: none;
}

.message {
    margin-top: 10px;
    font-size: 14px;
    color: #00ffcc;
}
</style>
</head>

<body>

<div class="container">
    <h2>Forgot Password</h2>

    <!-- Email Section -->
    <div id="emailSection">
        <input type="email" id="email" placeholder="Enter your email" required>
        <button onclick="sendOTP()">Send OTP</button>
        <div class="message" id="otpMessage"></div>
    </div>

    <!-- OTP Section -->
    <div id="otpSection" class="hidden">
        <input type="text" id="otpInput" placeholder="Enter OTP">
        <button onclick="verifyOTP()">Verify OTP</button>
    </div>

    <!-- Reset Password Section -->
    <div id="resetSection" class="hidden">
        <input type="password" id="newPassword" placeholder="Enter New Password">
        <button onclick="resetPassword()">Reset Password</button>
    </div>

</div>

<script>

let generatedOTP = "";

// Generate & "Send" OTP
function sendOTP() {
    const email = document.getElementById("email").value;

    if(email === "") {
        alert("Please enter your email.");
        return;
    }

    generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();

    document.getElementById("otpMessage").innerText =
        "OTP sent successfully! (Demo OTP: " + generatedOTP + ")";

    document.getElementById("otpSection").classList.remove("hidden");
}

// Verify OTP
function verifyOTP() {
    const userOTP = document.getElementById("otpInput").value;

    if(userOTP === generatedOTP) {
        alert("OTP Verified Successfully!");
        document.getElementById("resetSection").classList.remove("hidden");
    } else {
        alert("Invalid OTP. Try again.");
    }
}

// Reset Password
function resetPassword() {
    const newPassword = document.getElementById("newPassword").value;

    if(newPassword.length < 6) {
        alert("Password must be at least 6 characters.");
        return;
    }

    alert("Password Reset Successful!");
    window.location.href = "index.html"; // change if your login file name is different
}

</script>

</body>
</html>
