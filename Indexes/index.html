<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .login-box {
        width: 350px;
        padding: 40px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        backdrop-filter: blur(15px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        color: #fff;
        text-align: center;
    }

    .login-box h2 {
        margin-bottom: 30px;
        font-weight: 600;
        letter-spacing: 1px;
    }

    .input-group {
        position: relative;
        margin-bottom: 30px;
    }

    .input-group input {
        width: 100%;
        padding: 12px 10px;
        background: transparent;
        border: none;
        border-bottom: 2px solid rgba(255,255,255,0.5);
        outline: none;
        color: #fff;
        font-size: 16px;
        transition: 0.3s;
    }

    .input-group label {
        position: absolute;
        top: 12px;
        left: 10px;
        color: rgba(255,255,255,0.7);
        font-size: 16px;
        pointer-events: none;
        transition: 0.3s;
    }

    .input-group input:focus,
    .input-group input:valid {
        border-bottom: 2px solid #fff;
    }

    .input-group input:focus + label,
    .input-group input:valid + label {
        top: -10px;
        font-size: 12px;
        color: #fff;
    }

    .login-btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 30px;
        background: #fff;
        color: #764ba2;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .login-btn:hover {
        background: #764ba2;
        color: #fff;
        box-shadow: 0 0 15px rgba(255,255,255,0.6);
    }

    .extra-links {
        margin-top: 20px;
        font-size: 14px;
    }

    .extra-links a {
        color: #fff;
        text-decoration: none;
        opacity: 0.8;
        transition: 0.3s;
    }

    .extra-links a:hover {
        opacity: 1;
    }
</style>
</head>
<body>
    <!-- Visible content goes here -->
    <background src="imagefologin.png">
      <div class="login-box">
    <h2>Login</h2>

    <form>
        <div class="input-group">
            <input type="text" required>
            <label>Username</label>
        </div>

        <div class="input-group">
            <input type="password" required>
            <label>Password</label>
        </div>

        <button type="submit" class="login-btn">Sign In</button>

        <div class="extra-links">
            <p><a href="forgot.html">Forgot Password?</a></p>
        </div>
    </form><div class="extra-links">
    <p style="margin-top:10px;">Don't have an account? 
       <a href="signup.html"><b>Sign Up</b></a>
    </p>
</div>
</div>
</body>
</html>
